name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test on Node 22
        run: pnpm test
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm rebuild better-sqlite3
      - name: Test on Node 24
        run: pnpm test
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: pnpm rebuild better-sqlite3
      - name: Test on Node 26
        run: pnpm test

  embeddings-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/cache@v4
        with:
          path: /tmp/openbrain-real-embeddings
          key: embedding-model-${{ hashFiles('src/config.ts') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest run tests/embeddings-real.test.ts
        env:
          OPENBRAIN_REAL_EMBEDDINGS: "1"
