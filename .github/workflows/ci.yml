name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test on Node 22
        run: pnpm test
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm rebuild better-sqlite3
      - name: Test on Node 24
        run: pnpm test
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: pnpm rebuild better-sqlite3
      - name: Test on Node 26
        run: pnpm test

  embeddings-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/cache@v4
        with:
          path: /tmp/openbrain-real-embeddings
          key: embedding-model-${{ hashFiles('src/config.ts') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest run tests/embeddings-real.test.ts
        env:
          OPENBRAIN_REAL_EMBEDDINGS: "1"

  prepare-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, build, test, embeddings-integration]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Check current main commit
        id: main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')"
          if [[ "${current_sha}" == "${GITHUB_SHA}" ]]; then
            echo "current=true" >> "${GITHUB_OUTPUT}"
          else
            echo "::notice::A newer main commit superseded this release candidate"
          fi
      # ponytail: commit overrides require squash merges; use release-as if other merge methods must work.
      - name: Treat Dependabot update as patch
        if: steps.main.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr="$(gh api -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
            --jq '[.[] | select(.user.login == "dependabot[bot]" and .user.type == "Bot")] |
              if length == 1 then .[0] else empty end')"
          if [[ -z "${pr}" ]] || jq -e '(.body // "") | contains("BEGIN_COMMIT_OVERRIDE")' <<< "${pr}" > /dev/null; then
            exit 0
          fi
          title="$(jq -er '.title | select(test("^chore(\\([^)]*\\))?: ")) | sub("^chore"; "fix")' <<< "${pr}")"
          number="$(jq -er '.number' <<< "${pr}")"
          body="$(jq -r --arg title "${title}" '
            (.body // "") + "\n\nBEGIN_COMMIT_OVERRIDE\n" + $title + "\nEND_COMMIT_OVERRIDE\n"
          ' <<< "${pr}")"
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/pulls/${number}" -f "body=${body}" > /dev/null
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: prepare
        if: steps.main.outputs.current == 'true'
        with:
          release-type: node
          target-branch: main
      - name: Request release approval
        if: steps.prepare.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR: ${{ steps.prepare.outputs.pr }}
        run: |
          pr_number="$(jq -er '.number' <<< "${RELEASE_PR}")"
          head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}" --jq '.head.sha')"
          version="$(gh api -H "Accept: application/vnd.github.raw+json" \
            "repos/${GITHUB_REPOSITORY}/contents/package.json?ref=${head_sha}" --jq '.version')"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches" \
            -f event_type=prepared-release \
            -f "client_payload[version]=${version}"
