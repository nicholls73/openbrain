name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test on Node 22
        run: pnpm test
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm rebuild better-sqlite3
      - name: Test on Node 24
        run: pnpm test
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: pnpm rebuild better-sqlite3
      - name: Test on Node 26
        run: pnpm test

  embeddings-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/cache@v4
        with:
          path: /tmp/openbrain-real-embeddings
          key: embedding-model-${{ hashFiles('src/config.ts') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest run tests/embeddings-real.test.ts
        env:
          OPENBRAIN_REAL_EMBEDDINGS: "1"

  prepare-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, build, test, embeddings-integration]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Check current main commit
        id: main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')"
          if [[ "${current_sha}" == "${GITHUB_SHA}" ]]; then
            echo "current=true" >> "${GITHUB_OUTPUT}"
          else
            echo "::notice::A newer main commit superseded this release candidate"
          fi
      - name: Prepare Dependabot patch fallback
        id: dependabot
        if: steps.main.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          updates="$(gh api -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
            --jq '[.[] | select(.user.login == "dependabot[bot]" and .user.type == "Bot")] |
              length')"
          pending="$(gh pr list --repo "${GITHUB_REPOSITORY}" --state open --base main \
            --label "autorelease: pending" --json number --jq 'length')"
          if [[ "${updates}" -ne 1 || "${pending}" -ne 0 ]]; then
            exit 0
          fi
          current="$(gh api -H "Accept: application/vnd.github.raw+json" \
            "repos/${GITHUB_REPOSITORY}/contents/package.json?ref=${GITHUB_SHA}" --jq '.version')"
          release_as="$(jq -nr --arg version "${current}" '
            $version | capture("^(?<major>0|[1-9][0-9]*)\\.(?<minor>0|[1-9][0-9]*)\\.(?<patch>0|[1-9][0-9]*)$") |
            "\(.major).\(.minor).\((.patch | tonumber) + 1)"
          ')"
          echo "release_as=${release_as}" >> "${GITHUB_OUTPUT}"
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: prepare
        if: steps.main.outputs.current == 'true'
        with:
          release-type: node
          target-branch: main
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: dependabot_prepare
        if: steps.dependabot.outputs.release_as != '' && steps.prepare.outputs.prs_created != 'true'
        with:
          release-type: node
          target-branch: main
          release-as: ${{ steps.dependabot.outputs.release_as }}
      - name: Request release approval
        if: steps.prepare.outputs.prs_created == 'true' || steps.dependabot_prepare.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR: ${{ steps.prepare.outputs.pr || steps.dependabot_prepare.outputs.pr }}
        run: |
          pr_number="$(jq -er '.number' <<< "${RELEASE_PR}")"
          head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}" --jq '.head.sha')"
          version="$(gh api -H "Accept: application/vnd.github.raw+json" \
            "repos/${GITHUB_REPOSITORY}/contents/package.json?ref=${head_sha}" --jq '.version')"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches" \
            -f event_type=prepared-release \
            -f "client_payload[version]=${version}"
