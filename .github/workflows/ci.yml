name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test on Node 22
        run: pnpm test
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm rebuild better-sqlite3
      - name: Test on Node 24
        run: pnpm test
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: pnpm rebuild better-sqlite3
      - name: Test on Node 26
        run: pnpm test

  embeddings-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/cache@v4
        with:
          path: /tmp/openbrain-real-embeddings
          key: embedding-model-${{ hashFiles('src/config.ts') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest run tests/embeddings-real.test.ts
        env:
          OPENBRAIN_REAL_EMBEDDINGS: "1"

  prepare-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, build, test, embeddings-integration]
    runs-on: ubuntu-latest
    permissions:
      actions: write
      checks: read
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Check current main commit
        id: main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')"
          if [[ "${current_sha}" == "${GITHUB_SHA}" ]]; then
            echo "current=true" >> "${GITHUB_OUTPUT}"
          else
            echo "::notice::A newer main commit superseded this release candidate"
          fi
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: prepare
        if: steps.main.outputs.current == 'true'
        with:
          release-type: node
          target-branch: main
      - name: Run release checks and start approval
        if: steps.prepare.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR: ${{ steps.prepare.outputs.pr }}
        run: |
          pr_number="$(jq -er '.number' <<< "${RELEASE_PR}")"
          pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}")"
          pr_head_sha="$(jq -r '.head.sha' <<< "${pr}")"
          pr_head_ref="$(jq -r '.head.ref' <<< "${pr}")"
          version="$(gh api -H "Accept: application/vnd.github.raw+json" "repos/${GITHUB_REPOSITORY}/contents/package.json?ref=${pr_head_sha}" --jq '.version')"
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*)|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.((0|[1-9][0-9]*)|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "${version}" =~ ${semver} ]]; then
            echo "::error::Release Please produced an invalid version: ${version}"
            exit 1
          fi
          dispatch="$(
            gh api --method POST \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/dispatches" \
              -f "ref=${pr_head_ref}" \
              -F return_run_details=true
          )"
          ci_run_id="$(jq -er '.workflow_run_id' <<< "${dispatch}")"
          gh run watch "${ci_run_id}" --repo "${GITHUB_REPOSITORY}" --exit-status
          gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches" \
            -f event_type=prepared-release \
            -f "client_payload[sha]=${GITHUB_SHA}" \
            -f "client_payload[pr]=${pr_number}" \
            -f "client_payload[version]=${version}"
