name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: release

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_sha == github.sha
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          release-type: node
          target-branch: main
      - uses: actions/checkout@v6
        if: steps.release.outputs.release_created == 'true'
        with:
          ref: ${{ steps.release.outputs.tag_name }}
      - name: Build release archive
        if: steps.release.outputs.release_created == 'true'
        run: |
          tag="${{ steps.release.outputs.tag_name }}"
          git archive --format=tar.gz --prefix "openbrain-${tag}/" -o "openbrain-${tag}.tar.gz" "${tag}"
          shasum -a 256 "openbrain-${tag}.tar.gz" > "openbrain-${tag}.tar.gz.sha256"
      - uses: pnpm/action-setup@v4
        if: steps.release.outputs.release_created == 'true'
      - uses: actions/setup-node@v6
        if: steps.release.outputs.release_created == 'true'
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - if: steps.release.outputs.release_created == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.release.outputs.release_created == 'true'
        run: npm publish --access public
      - name: Upload release archive
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.release.outputs.tag_name }}"
          gh release upload "${tag}" "openbrain-${tag}.tar.gz" "openbrain-${tag}.tar.gz.sha256"
