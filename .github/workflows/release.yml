name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build source archive and checksum
        run: |
          git archive --format=tar.gz --prefix "openbrain-${GITHUB_REF_NAME}/" \
            -o "openbrain-${GITHUB_REF_NAME}.tar.gz" "${GITHUB_REF_NAME}"
          shasum -a 256 "openbrain-${GITHUB_REF_NAME}.tar.gz" > "openbrain-${GITHUB_REF_NAME}.tar.gz.sha256"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "openbrain-${GITHUB_REF_NAME}.tar.gz" \
            "openbrain-${GITHUB_REF_NAME}.tar.gz.sha256" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
