name: Release
run-name: ${{ github.event_name == 'repository_dispatch' && format('Release v{0}', github.event.client_payload.version) || 'Release approval' }}

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  repository_dispatch:
    types: [approved-release]

concurrency:
  group: ${{ github.event_name == 'workflow_run' && 'release-approval' || 'release' }}
  cancel-in-progress: ${{ github.event_name == 'workflow_run' }}

jobs:
  approve:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_sha == github.sha
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: prepare
        with:
          release-type: node
          target-branch: main
      - name: Start approved release
        if: steps.prepare.outputs.prs_created == 'true'
        env:
          APPROVED_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR: ${{ steps.prepare.outputs.pr }}
        run: |
          pr_number="$(jq -er '.number' <<< "${RELEASE_PR}")"
          pr_head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}" --jq '.head.sha')"
          version="$(gh api -H "Accept: application/vnd.github.raw+json" "repos/${GITHUB_REPOSITORY}/contents/package.json?ref=${pr_head_sha}" --jq '.version')"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release Please produced an invalid version: ${version}"
            exit 1
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches" \
            -f event_type=approved-release \
            -f "client_payload[sha]=${APPROVED_SHA}" \
            -f "client_payload[pr]=${pr_number}" \
            -f "client_payload[version]=${version}"

  release:
    if: github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.finalize.outputs.release_created }}
      tag_name: ${{ steps.finalize.outputs.tag_name }}
      version: ${{ steps.finalize.outputs.version }}
    steps:
      - name: Verify approved release
        env:
          APPROVED_SHA: ${{ github.event.client_payload.sha }}
          EXPECTED_VERSION: ${{ github.event.client_payload.version }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR: ${{ github.event.client_payload.pr }}
        run: |
          if [[ ! "${RELEASE_PR}" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid release PR: ${RELEASE_PR}"
            exit 1
          fi
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')"
          if [[ "${current_sha}" != "${APPROVED_SHA}" ]]; then
            echo "::error::main changed after approval; approve the latest Release run"
            exit 1
          fi
          pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${RELEASE_PR}")"
          if ! jq -e --arg sha "${APPROVED_SHA}" --arg repo "${GITHUB_REPOSITORY}" '
            .state == "open" and
            .base.ref == "main" and
            .base.sha == $sha and
            .head.repo.full_name == $repo and
            .user.login == "github-actions[bot]"
          ' <<< "${pr}" > /dev/null; then
            echo "::error::Release PR does not match the approved main commit"
            exit 1
          fi
          pr_head_sha="$(jq -r '.head.sha' <<< "${pr}")"
          pr_version="$(gh api -H "Accept: application/vnd.github.raw+json" "repos/${GITHUB_REPOSITORY}/contents/package.json?ref=${pr_head_sha}" --jq '.version')"
          if [[ "${pr_version}" != "${EXPECTED_VERSION}" ]]; then
            echo "::error::Release PR version ${pr_version} does not match approved version ${EXPECTED_VERSION}"
            exit 1
          fi
      - name: Merge approved release PR
        env:
          APPROVED_SHA: ${{ github.event.client_payload.sha }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR: ${{ github.event.client_payload.pr }}
        run: |
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')"
          if [[ "${current_sha}" != "${APPROVED_SHA}" ]]; then
            echo "::error::main changed after approval; approve the latest Release run"
            exit 1
          fi
          gh pr merge "${RELEASE_PR}" --repo "${GITHUB_REPOSITORY}" --merge
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: finalize
        with:
          release-type: node
          target-branch: main
          skip-github-pull-request: true
      - name: Verify released version
        if: steps.finalize.outputs.release_created == 'true' && steps.finalize.outputs.version != github.event.client_payload.version
        run: |
          echo "::error::Released version ${{ steps.finalize.outputs.version }} does not match approved version ${{ github.event.client_payload.version }}"
          exit 1

  publish:
    name: Publish v${{ needs.release.outputs.version }}
    needs: release
    if: needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.release.outputs.tag_name }}
      - name: Build release archive
        run: |
          tag="${{ needs.release.outputs.tag_name }}"
          git archive --format=tar.gz --prefix "openbrain-${tag}/" -o "openbrain-${tag}.tar.gz" "${tag}"
          shasum -a 256 "openbrain-${tag}.tar.gz" > "openbrain-${tag}.tar.gz.sha256"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: npm publish --access public
      - name: Upload release archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ needs.release.outputs.tag_name }}"
          gh release upload "${tag}" "openbrain-${tag}.tar.gz" "openbrain-${tag}.tar.gz.sha256"
